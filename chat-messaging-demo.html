<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Chat · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css?v=20260922">
</head>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page">
            <div class="demo-page__header">
                <h1><span data-demo-icon="chat"></span>Team Chat</h1>
                <p id="subtitle">100,000 variable-height messages: send one and it auto-scrolls to the bottom.</p>
            </div>

            <div class="demo-scroll chat-scroll" id="scroll"></div>

            <div class="chat-composer">
                <textarea id="draft" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)"></textarea>
                <button id="sendBtn" type="button" disabled>Send</button>
            </div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260922"></script>
    <script src="demo-icons.js?v=20260922"></script>
    <script src="demo-docs.js?v=20260922"></script>
    <script src="demo-bootstrap.js?v=20260922"></script>
    <script>
        (function () {
            const CHAT_BASE = 100000;
            const USERS = [
                { name: 'Alice Chen',   emoji: '👩‍💻', color: '#667eea' },
                { name: 'Bob Smith',    emoji: '🧑‍💼', color: '#d6336c' },
                { name: 'Carol Davis',  emoji: '👩‍🔬', color: '#1c7ed6' },
                { name: 'David Kim',    emoji: '🧑‍🎨', color: '#2f9e44' },
                { name: 'Emma Wilson',  emoji: '👩‍🏫', color: '#e8590c' },
                { name: 'Frank Brown',  emoji: '🧑‍🚀', color: '#0ca678' },
                { name: 'Grace Lee',    emoji: '👩‍⚕️', color: '#7048e8' },
                { name: 'Henry Zhang',  emoji: '🧑‍🔧', color: '#c2255c' },
            ];
            const ME = { name: 'You', emoji: '😊', color: '#00b09b' };
            const TEMPLATES = [
                'Hey team! Any update on {topic}?',
                'I just finished {task}. Ready for review!',
                'Can someone help me with {problem}?',
                'Great job on {achievement}! 🎉',
                'Quick question about {topic}, anyone available?',
                'Thanks for the feedback on {task}!',
                "I'll take care of {task} by EOD",
                'Meeting in 10 about {topic}',
                'Just pushed the latest changes for {task}',
                'Found a bug in {problem}, investigating now',
                'Coffee break? ☕',
                "Who's up for lunch?",
                '👍',
                'Agreed!',
                "Let's discuss in standup",
                'Updated the docs for {topic}',
                'This is looking great, keep it up!',
                "I'm blocked on {task}, need a hand",
                'Running tests now…',
                'All green! ✅',
                'Deployed to staging',
                'Code review complete, looks good!',
            ];
            const TOPICS = ['the new feature', 'authentication', 'DB optimization', 'the UI redesign', 'API endpoints', 'deployment'];
            const TASKS = ['the login flow', 'the dashboard', 'payment integration', 'email notifications', 'search', 'the admin panel'];
            const PROBLEMS = ['the caching layer', 'rate limiting', 'memory usage', 'slow queries', 'build errors'];
            const ACHIEVEMENTS = ['hitting our KPIs', 'the launch', 'fixing the critical bug', 'the perf win'];
            const REACTIONS = ['❤️', '👍', '😂', '🎉', '🚀'];
            const { randInt, pick } = window.demoUtils;

            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            function generate(index) {
                const user = USERS[index % USERS.length];
                let text = TEMPLATES[index % TEMPLATES.length]
                    .replace('{topic}', pick(TOPICS, index, 1))
                    .replace('{task}', pick(TASKS, index, 2))
                    .replace('{problem}', pick(PROBLEMS, index, 3))
                    .replace('{achievement}', pick(ACHIEVEMENTS, index, 4));
                const variant = index % 5;
                if (variant === 3) text += " I've been on this a while and we're making good progress. Shout if you have questions or concerns!";
                else if (variant === 4) text += " Quick update: everything's on track and early feedback is positive. Done by end of week.";
                const reactions = index % 7 === 0
                    ? [{ emoji: REACTIONS[index % REACTIONS.length], count: randInt(index, 1, 5, 9) }]
                    : [];
                const ts = new Date(Date.UTC(2026, 0, 1) - (CHAT_BASE - index) * 60000);
                const time = String(ts.getUTCHours()).padStart(2, '0') + ':' + String(ts.getUTCMinutes()).padStart(2, '0');
                return { user, text, time, reactions, isSent: false };
            }

            const sent = [];

            function nowTime() {
                const d = new Date();
                return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            }

            function getMessage(index) {
                return index < CHAT_BASE ? generate(index) : sent[index - CHAT_BASE];
            }

            function render(index, container) {
                const m = getMessage(index);
                if (!m) return;
                const row = document.createElement('div');
                row.className = 'msg' + (m.isSent ? ' sent' : '');
                let reactionsHtml = '';
                if (m.reactions && m.reactions.length) {
                    reactionsHtml = '<div class="msg__reactions">' +
                        m.reactions.map((r) => '<span class="msg__reaction">' + r.emoji + ' ' + r.count + '</span>').join('') +
                        '</div>';
                }
                row.innerHTML =
                    '<div class="msg__avatar" style="background:' + m.user.color + '">' + m.user.emoji + '</div>' +
                    '<div class="msg__body">' +
                        '<div class="msg__meta">' +
                            '<span class="msg__name">' + escapeHtml(m.user.name) + '</span>' +
                            '<span>' + m.time + '</span>' +
                        '</div>' +
                        '<div class="msg__bubble">' + escapeHtml(m.text) + '</div>' +
                        reactionsHtml +
                    '</div>';
                container.appendChild(row);
            }

            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: CHAT_BASE,
                render: render,
            });

            requestAnimationFrame(() => demo.scrollToPercentage(100));

            const draft = document.getElementById('draft');
            const sendBtn = document.getElementById('sendBtn');

            function updateSubtitle() {
                const t = CHAT_BASE + sent.length;
                document.getElementById('subtitle').textContent =
                    t.toLocaleString() + ' variable-height messages, send one and it auto-scrolls to the bottom.';
            }

            function send() {
                const text = draft.value.trim();
                if (!text) return;
                sent.push({ user: ME, text, time: nowTime(), reactions: [], isSent: true });
                draft.value = '';
                sendBtn.disabled = true;
                updateSubtitle();
                demo.setTotal(CHAT_BASE + sent.length);
                requestAnimationFrame(() => demo.scrollToPercentage(100));
            }

            draft.addEventListener('input', () => { sendBtn.disabled = !draft.value.trim(); });
            draft.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
            });
            sendBtn.addEventListener('click', send);
        })();
    </script>
    <!-- "How to build this": the options this demo exists to show,
         pulled out of the page source and put next to the demo. -->
    <script>
        // Deferred on some pages, inline on others: either way this runs
        // before demo-docs.js has executed unless we wait for it.
        (function (config) {
            function mount() { window.demoDocs(config); }
            if (window.demoDocs) mount();
            else document.addEventListener('DOMContentLoaded', mount);
        }({
        "feature": "Variable-height bubbles with stick-to-bottom",
        "intro": "A chat log is a virtual scroller with two extra habits: message heights are unknown until rendered, and the view should stay pinned to the newest message, but only when the reader was already at the bottom. Scrolling up to read history and then being yanked back down by an incoming message is the bug every chat UI has shipped at least once. The check is simply whether the camera is on the last element before you grow the dataset.",
        "code": "\n    const scroller = new CeriousScroll(host, messages.length, {\n      render: function (index, container) {\n        container.textContent = '';\n        container.appendChild(buildBubble(messages[index]));\n      }\n    });\n\n    function onMessage(msg) {\n      // Decide BEFORE the dataset grows.\n      const wasAtBottom = scroller.currentElement >= messages.length - 2;\n\n      messages.push(msg);\n      scroller.updateTotalElements(messages.length);\n\n      // Only follow if they were already following.\n      if (wasAtBottom) scroller.jumpToElement(messages.length - 1);\n    }\n  ",
        "notes": [
                "Capture “was at bottom” before you change the length, not after: afterwards the answer is always no.",
                "Bubbles are measured, so mixed text, images and attachments need no declared heights.",
                "Reserve space for attachments before they load, or a late image will push the newest message off screen.",
                "Backfilling older messages at the top is the prepend-and-anchor case; see that demo."
        ],
        "docs": "https://github.com/ceriousdevtech/cerious-scroll/blob/main/docs/IMPLEMENTATION_GUIDE.md"
    }));
    </script>
</body>
</html>
