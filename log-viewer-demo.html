<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css?v=20260922">
</head>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page">
            <div class="demo-page__header">
                <h1><span data-demo-icon="logs"></span>Log Viewer</h1>
                <p id="subtitle">200,000 of 200,000 lines: filter by level, search the stream.</p>
            </div>

            <div class="demo-toolbar" id="toolbar">
                <span class="chip ERROR active" data-level="ERROR">ERROR</span>
                <span class="chip WARN active" data-level="WARN">WARN</span>
                <span class="chip INFO active" data-level="INFO">INFO</span>
                <span class="chip DEBUG active" data-level="DEBUG">DEBUG</span>
                <input type="search" id="search" placeholder="Search messages…" style="flex:1; min-width:200px">
                <span class="stat"><strong id="countLabel">200,000</strong> lines</span>
            </div>

            <div class="demo-scroll log-scroll" id="scroll"></div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260922"></script>
    <script src="demo-icons.js?v=20260922"></script>
    <script src="demo-docs.js?v=20260922"></script>
    <script src="demo-bootstrap.js?v=20260922"></script>
    <script>
        (function () {
            const LOG_TOTAL = 200000;
            const LEVELS = ['ERROR', 'WARN', 'INFO', 'DEBUG'];
            const SERVICES = ['api-gateway', 'auth-svc', 'db-pool', 'cache', 'worker', 'scheduler', 'payments', 'mailer'];
            const TEMPLATES = [
                { level: 'INFO',  t: 'User authentication successful for user_{id}' },
                { level: 'INFO',  t: 'Database connection established to postgres://prod-db-{id}' },
                { level: 'INFO',  t: 'HTTP GET /api/users/{id} responded with 200' },
                { level: 'WARN',  t: 'High memory usage detected: {value}% of available RAM' },
                { level: 'WARN',  t: 'Slow query detected: SELECT * FROM users took {value}ms' },
                { level: 'ERROR', t: 'Failed to connect to Redis cache: connection timeout' },
                { level: 'ERROR', t: 'Unhandled exception in UserService: NullPointerException at line {id}' },
                { level: 'ERROR', t: 'Transaction rolled back: constraint violation on user_email' },
                { level: 'DEBUG', t: 'Processing batch #{id} with {value} items' },
                { level: 'DEBUG', t: 'Cache hit for key "user_profile_{id}"' },
                { level: 'INFO',  t: 'Scheduled task "DataSync" started' },
                { level: 'WARN',  t: 'Rate limit approaching for API key {id}' },
                { level: 'ERROR', t: 'Payment failed: insufficient funds for txn {id}' },
                { level: 'INFO',  t: 'Email sent successfully to user@example-{id}.com' },
                { level: 'DEBUG', t: 'WebSocket connection {id} heartbeat received' },
            ];
            const { randInt, pick } = window.demoUtils;

            function makeLog(index) {
                const tpl = TEMPLATES[index % TEMPLATES.length];
                const message = tpl.t
                    .replace('{id}', String(index))
                    .replace('{value}', String(randInt(index, 10, 99, 3)));
                const ts = new Date(Date.UTC(2026, 0, 1) - (LOG_TOTAL - index) * 1000);
                const time = ts.toISOString().slice(11, 19) + '.' +
                    String(randInt(index, 0, 999, 4)).padStart(3, '0');
                return { level: tpl.level, time, service: pick(SERVICES, index, 5), message };
            }

            let active = new Set(LEVELS);
            let query = '';
            let order = buildOrder();

            function buildOrder() {
                const q = query.trim().toLowerCase();
                const out = [];
                for (let i = 0; i < LOG_TOTAL; i++) {
                    const lg = makeLog(i);
                    if (!active.has(lg.level)) continue;
                    if (q && !lg.message.toLowerCase().includes(q) && !lg.service.includes(q)) continue;
                    out.push(i);
                }
                return out;
            }

            function render(visIndex, container) {
                const src = order[visIndex];
                if (src == null) return;
                const lg = makeLog(src);
                const row = document.createElement('div');
                row.className = 'log-row';
                row.innerHTML =
                    '<span class="log-time">' + lg.time + '</span>' +
                    '<span class="log-level ' + lg.level + '">' + lg.level + '</span>' +
                    '<span class="log-service">' + lg.service + '</span>' +
                    '<span class="log-msg">' + escapeHtml(lg.message) + '</span>';
                container.appendChild(row);
            }

            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            function updateSubtitle() {
                document.getElementById('subtitle').textContent =
                    order.length.toLocaleString() + ' of ' + LOG_TOTAL.toLocaleString() + ' lines, filter by level, search the stream.';
                document.getElementById('countLabel').textContent = order.length.toLocaleString();
            }

            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: Math.max(1, order.length),
                render: render,
            });
            updateSubtitle();

            function rebuild() {
                order = buildOrder();
                updateSubtitle();
                demo.setTotal(Math.max(1, order.length));
                demo.jumpTo(0);
            }

            document.getElementById('toolbar').addEventListener('click', (e) => {
                const lvl = e.target.dataset && e.target.dataset.level;
                if (!lvl) return;
                if (active.has(lvl)) active.delete(lvl);
                else active.add(lvl);
                e.target.classList.toggle('active');
                rebuild();
            });

            let debounce;
            document.getElementById('search').addEventListener('input', (e) => {
                clearTimeout(debounce);
                const v = e.target.value;
                debounce = setTimeout(() => { query = v; rebuild(); }, 250);
            });
        })();
    </script>
    <!-- "How to build this": the options this demo exists to show,
         pulled out of the page source and put next to the demo. -->
    <script>
        // Deferred on some pages, inline on others: either way this runs
        // before demo-docs.js has executed unless we wait for it.
        (function (config) {
            function mount() { window.demoDocs(config); }
            if (window.demoDocs) mount();
            else document.addEventListener('DOMContentLoaded', mount);
        }({
        "feature": "Filtering and searching a virtualized stream",
        "intro": "Filtering a virtual list is a question about your data, not about the scroller. The engine renders indices into whatever array you hand it, so a filter is: build the filtered view, tell the engine its new length, and repaint. The important detail is that an index means a position in the <em>current view</em>, so when the filter changes, every index changes meaning and <code>refresh()</code> is required even if the length happens to be the same.",
        "code": "\n    let view = lines;\n\n    const scroller = new CeriousScroll(host, view.length, {\n      render: function (index, container) {\n        container.textContent = '';\n        container.appendChild(renderLine(view[index]));\n      }\n    });\n\n    function applyFilter(level, query) {\n      view = lines.filter(function (l) {\n        return (level === 'all' || l.level === level) &&\n               (!query || l.text.includes(query));\n      });\n      scroller.updateTotalElements(view.length);\n      scroller.refresh();   // indices now mean something different\n    }\n  ",
        "notes": [
                "<code>refresh()</code> after a filter change is not optional; the recycler will not re-run your renderer for an index it already holds.",
                "For a live tail, append and follow only when the reader is already at the end.",
                "Highlighting a match is just markup in your renderer. There is nothing scroller-specific about it.",
                "Keep the filtered array around; the renderer is called often and should not be re-filtering per row."
        ],
        "docs": "https://github.com/ceriousdevtech/cerious-scroll/blob/main/docs/IMPLEMENTATION_GUIDE.md"
    }));
    </script>
</body>
</html>
