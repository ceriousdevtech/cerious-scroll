<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Viewer · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css?v=20260922">
</head>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page">
            <div class="demo-page__header">
                <h1><span data-demo-icon="code"></span>Code Viewer</h1>
                <p>100,000 syntax-highlighted lines with line numbers and find.</p>
            </div>

            <div class="demo-toolbar">
                <input id="find" type="search" placeholder="Find in file…" style="flex:1; min-width:220px">
                <button id="findBtn" type="button">Find next ↵</button>
                <button id="topBtn" type="button">Top</button>
                <span class="stat">100,000 lines</span>
            </div>

            <div class="demo-scroll code-scroll" id="scroll"></div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260922"></script>
    <script src="demo-icons.js?v=20260922"></script>
    <script src="demo-docs.js?v=20260922"></script>
    <script src="demo-bootstrap.js?v=20260922"></script>
    <script>
        (function () {
            const CODE_TOTAL = 100000;
            const SNIPPET = [
                '// Virtualized rendering keeps memory flat regardless of dataset size.',
                'export function renderViewport(height: number, rows: Row[]): Range {',
                '  const visible: number[] = [];',
                '  let offset = 0;',
                '  for (let i = startIndex; i < rows.length; i++) {',
                '    const el = pool.acquire(i);',
                '    el.style.top = offset + "px";',
                '    const measured = measure(el);',
                '    cache.set(i, measured);',
                '    offset += measured;',
                '    visible.push(i);',
                '    if (offset > height) break;',
                '  }',
                '  return { start: startIndex, end: visible.at(-1) ?? 0, visible };',
                '}',
                '',
                'class PerformanceCache {',
                '  private heights = new Map<number, number>();',
                '  constructor(private readonly total: number) {}',
                '  get(index: number): number | undefined {',
                '    return this.heights.get(index);',
                '  }',
                '  set(index: number, value: number): void {',
                '    this.heights.set(index, value);',
                '  }',
                '  clear(): void {',
                '    this.heights.clear();',
                '  }',
                '}',
                '',
                'const scroller = new CeriousScroll(container, 1000000, options);',
                'await scroller.ready();',
                'if (offset >= total && !done) {',
                '  emit("reached-end", { index: total - 1 });',
                '}',
                '',
            ];
            const KEYWORDS = new Set([
                'const','let','var','function','return','if','else','for','while','await','async',
                'import','from','export','class','new','interface','type','of','in','void','this',
                'private','public','readonly','constructor','number','string','boolean',
            ]);
            const TOKEN_RE = /(\s+|\/\/.*$|'[^']*'|`[^`]*`|"[^"]*"|\b\d+\b|\b[A-Za-z_$][\w$]*\b|[^\w\s])/g;

            function getLine(i) { return SNIPPET[i % SNIPPET.length]; }

            function tokenize(raw) {
                if (raw.trimStart().startsWith('//')) return [{ text: raw, type: 'comment' }];
                const parts = raw.match(TOKEN_RE) || [];
                const out = [];
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    if (/^\s+$/.test(p)) out.push({ text: p, type: 'plain' });
                    else if (/^['"`]/.test(p)) out.push({ text: p, type: 'string' });
                    else if (/^\d+$/.test(p)) out.push({ text: p, type: 'number' });
                    else if (/^[A-Za-z_$]/.test(p)) {
                        const next = parts[i + 1];
                        if (KEYWORDS.has(p)) out.push({ text: p, type: 'keyword' });
                        else if (next === '(') out.push({ text: p, type: 'fn' });
                        else out.push({ text: p, type: 'plain' });
                    } else out.push({ text: p, type: 'punct' });
                }
                return out;
            }

            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            let query = '';

            function render(i, container) {
                const raw = getLine(i);
                const tokens = tokenize(raw);
                const isMatch = query.length > 0 && raw.toLowerCase().includes(query);
                const row = document.createElement('div');
                row.className = 'code-row' + (isMatch ? ' match' : '');
                let html = '<span class="code-gutter">' + (i + 1) + '</span><span class="code-text">';
                for (const t of tokens) html += '<span class="tok-' + t.type + '">' + escapeHtml(t.text) + '</span>';
                html += '</span>';
                row.innerHTML = html;
                container.appendChild(row);
            }

            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: CODE_TOTAL,
                render: render,
            });

            function runFind() {
                query = document.getElementById('find').value.trim().toLowerCase();
                if (!query) { demo.refresh(); return; }
                for (let i = 0; i < CODE_TOTAL; i++) {
                    if (getLine(i).toLowerCase().includes(query)) { demo.jumpTo(i); return; }
                }
                demo.refresh();
            }

            document.getElementById('findBtn').addEventListener('click', runFind);
            document.getElementById('find').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') runFind();
            });
            document.getElementById('topBtn').addEventListener('click', () => demo.scrollToPercentage(0));
        })();
    </script>
    <!-- "How to build this": the options this demo exists to show,
         pulled out of the page source and put next to the demo. -->
    <script>
        // Deferred on some pages, inline on others: either way this runs
        // before demo-docs.js has executed unless we wait for it.
        (function (config) {
            function mount() { window.demoDocs(config); }
            if (window.demoDocs) mount();
            else document.addEventListener('DOMContentLoaded', mount);
        }({
        "feature": "Fixed-height lines and jump-to-line",
        "intro": "Source code is the friendly case: every line is the same height, so the layout is entirely predictable and jumping to a line is exact. It is also the case where recycling discipline matters most, because each line is cheap and the renderer runs constantly: building a DOM tree per line will show up long before the scrolling does. Syntax highlighting is markup your renderer produces; the scroller neither knows nor cares.",
        "code": "\n    const scroller = new CeriousScroll(host, lines.length, {\n      render: function (index, container) {\n        // Reuse the same two nodes rather than rebuilding them per line.\n        let gutter = container.firstElementChild;\n        let code = gutter && gutter.nextElementSibling;\n        if (!gutter) {\n          gutter = document.createElement('span');\n          gutter.className = 'ln';\n          code = document.createElement('code');\n          container.append(gutter, code);\n        }\n        gutter.textContent = index + 1;\n        code.innerHTML = highlight(lines[index]);\n      }\n    });\n\n    scroller.jumpToElement(lineNumber - 1);   // exact, and O(1)\n  ",
        "notes": [
                "Reusing child nodes instead of clearing and rebuilding is the single biggest win in a renderer this hot.",
                "Highlight once into a cache if it is expensive; the renderer may be called many times for the same line.",
                "Uniform line height means the engine can skip per-row measurement: keep it uniform and do not let wrapping in.",
                "<code>white-space: pre</code> plus a horizontal scroller beats wrapping, which would make every line a different height."
        ],
        "docs": "https://github.com/ceriousdevtech/cerious-scroll/blob/main/docs/IMPLEMENTATION_GUIDE.md"
    }));
    </script>
</body>
</html>
