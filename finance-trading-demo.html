<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Ticker · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css?v=20260922">
</head>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page">
            <div class="demo-page__header">
                <h1><span data-demo-icon="finance"></span>Live Market Ticker</h1>
                <p>5,000 symbols with streaming prices and sparklines.</p>
            </div>

            <div class="demo-toolbar">
                <button id="liveBtn" class="is-active" type="button">⏸ Pause stream</button>
                <span class="stat">updates every 1.2s</span>
            </div>

            <div class="demo-scroll fin-scroll" id="scroll"></div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260922"></script>
    <script src="demo-icons.js?v=20260922"></script>
    <script src="demo-docs.js?v=20260922"></script>
    <script src="demo-bootstrap.js?v=20260922"></script>
    <script>
        (function () {
            const FIN_TOTAL = 5000;
            const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const SECTORS = ['Tech', 'Energy', 'Health', 'Finance', 'Retail', 'Auto', 'Media', 'Industrial'];
            const SUFFIX = ['Inc', 'Corp', 'Labs', 'Group', 'Holdings', 'Systems', 'Partners'];
            const ROOTS = ['Apex', 'Nova', 'Quantum', 'Vertex', 'Helio', 'Cobalt', 'Orbit', 'Pulse', 'Atlas', 'Lumen', 'Forge', 'Drift'];
            const { hash, pick } = window.demoUtils;

            const stocks = new Array(FIN_TOTAL);
            const prices = new Array(FIN_TOTAL);
            const sparks = new Array(FIN_TOTAL);

            for (let i = 0; i < FIN_TOTAL; i++) {
                const a = LETTERS[(i * 7) % 26], b = LETTERS[(i * 13) % 26], c = LETTERS[(i * 17) % 26];
                const base = Math.round((hash(i, 4) * 480 + 12) * 100) / 100;
                stocks[i] = {
                    symbol: a + b + c + (i % 9),
                    name: pick(ROOTS, i, 1) + ' ' + pick(SUFFIX, i, 2),
                    sector: pick(SECTORS, i, 3),
                    base: base,
                };
                prices[i] = base;
                const pts = [];
                const w = 110, h = 28, n = 24, step = w / (n - 1);
                for (let k = 0; k < n; k++) {
                    const v = hash(i, 100 + k);
                    pts.push((k * step).toFixed(1) + ',' + (h - v * h).toFixed(1));
                }
                sparks[i] = pts.join(' ');
            }

            function render(i, container) {
                const s = stocks[i];
                const p = prices[i];
                const pct = ((p - s.base) / s.base) * 100;
                const up = pct >= 0;
                const stroke = up ? '#3fb950' : '#f85149';
                const row = document.createElement('div');
                row.className = 'fin-row';
                row.innerHTML =
                    '<span class="fin-sym">' + s.symbol + '</span>' +
                    '<span class="fin-name">' + s.name + '<small>' + s.sector + '</small></span>' +
                    '<svg class="fin-spark" width="110" height="28">' +
                        '<polyline points="' + sparks[i] + '" fill="none" stroke="' + stroke + '" stroke-width="1.5"/>' +
                    '</svg>' +
                    '<span class="fin-price">$' + p.toFixed(2) + '</span>' +
                    '<span class="fin-change ' + (up ? 'fin-up' : 'fin-down') + '">' +
                        (up ? '▲' : '▼') + ' ' + Math.abs(pct).toFixed(2) + '%' +
                    '</span>';
                container.appendChild(row);
            }

            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: FIN_TOTAL,
                render: render,
            });

            let live = true;
            const btn = document.getElementById('liveBtn');
            btn.addEventListener('click', () => {
                live = !live;
                btn.classList.toggle('is-active', live);
                btn.textContent = live ? '⏸ Pause stream' : '▶ Resume stream';
            });

            setInterval(() => {
                if (!live) return;
                for (let i = 0; i < FIN_TOTAL; i++) {
                    const drift = (Math.random() - 0.5) * 0.02;
                    prices[i] = Math.max(1, Math.round(prices[i] * (1 + drift) * 100) / 100);
                }
                demo.refresh();
            }, 1200);
        })();
    </script>
    <!-- "How to build this": the options this demo exists to show,
         pulled out of the page source and put next to the demo. -->
    <script>
        // Deferred on some pages, inline on others: either way this runs
        // before demo-docs.js has executed unless we wait for it.
        (function (config) {
            function mount() { window.demoDocs(config); }
            if (window.demoDocs) mount();
            else document.addEventListener('DOMContentLoaded', mount);
        }({
        "feature": "High-frequency updates against a moving window",
        "intro": "A ticker updates far more often than it scrolls, and almost every update is for a row that is not on screen. The efficient shape is therefore the inverse of the usual one: write incoming prices into your data unconditionally, and repaint only what is mounted, only as often as a person can see. <code>refresh()</code> re-runs the renderer for the mounted rows, so driving it from a timer decouples your paint rate from your message rate entirely.",
        "code": "\n    const scroller = new CeriousScroll(host, symbols.length, {\n      render: function (index, container) {\n        const s = symbols[index];\n        container.textContent = '';\n        container.appendChild(buildTickerRow(s, prices[s.id]));\n      }\n    });\n\n    // Messages arrive at whatever rate the feed sends them.\n    socket.onmessage = function (e) {\n      const tick = JSON.parse(e.data);\n      prices[tick.id] = tick;          // just update the data\n    };\n\n    // Paint at a rate a human can actually read, not at the feed's rate.\n    setInterval(function () { scroller.refresh(); }, 250);\n  ",
        "notes": [
                "Do not call <code>refresh()</code> per message. Coalesce on a timer or a rAF; the mounted window is what costs, not the message.",
                "Flash-on-change effects should be driven from your data (compare to the previous value), not from a CSS animation on a recycled node.",
                "Sparklines are cheapest as an inline SVG path built from a fixed-length ring buffer per symbol.",
                "Sorting by a live value means indices change constantly: key any selection on the symbol id."
        ],
        "docs": "https://github.com/ceriousdevtech/cerious-scroll/blob/main/docs/IMPLEMENTATION_GUIDE.md"
    }));
    </script>
</body>
</html>
