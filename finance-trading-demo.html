<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Ticker · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S1NK61TS72"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-S1NK61TS72');
</script>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page">
            <div class="demo-page__header">
                <h1>📈 Live Market Ticker</h1>
                <p>5,000 symbols with streaming prices and sparklines.</p>
            </div>

            <div class="demo-toolbar">
                <button id="liveBtn" class="is-active" type="button">⏸ Pause stream</button>
                <span class="stat">updates every 1.2s</span>
            </div>

            <div class="demo-scroll fin-scroll" id="scroll"></div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260607"></script>
    <script src="demo-bootstrap.js?v=20260607"></script>
    <script>
        (function () {
            const FIN_TOTAL = 5000;
            const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const SECTORS = ['Tech', 'Energy', 'Health', 'Finance', 'Retail', 'Auto', 'Media', 'Industrial'];
            const SUFFIX = ['Inc', 'Corp', 'Labs', 'Group', 'Holdings', 'Systems', 'Partners'];
            const ROOTS = ['Apex', 'Nova', 'Quantum', 'Vertex', 'Helio', 'Cobalt', 'Orbit', 'Pulse', 'Atlas', 'Lumen', 'Forge', 'Drift'];
            const { hash, pick } = window.demoUtils;

            const stocks = new Array(FIN_TOTAL);
            const prices = new Array(FIN_TOTAL);
            const sparks = new Array(FIN_TOTAL);

            for (let i = 0; i < FIN_TOTAL; i++) {
                const a = LETTERS[(i * 7) % 26], b = LETTERS[(i * 13) % 26], c = LETTERS[(i * 17) % 26];
                const base = Math.round((hash(i, 4) * 480 + 12) * 100) / 100;
                stocks[i] = {
                    symbol: a + b + c + (i % 9),
                    name: pick(ROOTS, i, 1) + ' ' + pick(SUFFIX, i, 2),
                    sector: pick(SECTORS, i, 3),
                    base: base,
                };
                prices[i] = base;
                const pts = [];
                const w = 110, h = 28, n = 24, step = w / (n - 1);
                for (let k = 0; k < n; k++) {
                    const v = hash(i, 100 + k);
                    pts.push((k * step).toFixed(1) + ',' + (h - v * h).toFixed(1));
                }
                sparks[i] = pts.join(' ');
            }

            function render(i, container) {
                const s = stocks[i];
                const p = prices[i];
                const pct = ((p - s.base) / s.base) * 100;
                const up = pct >= 0;
                const stroke = up ? '#3fb950' : '#f85149';
                const row = document.createElement('div');
                row.className = 'fin-row';
                row.innerHTML =
                    '<span class="fin-sym">' + s.symbol + '</span>' +
                    '<span class="fin-name">' + s.name + '<small>' + s.sector + '</small></span>' +
                    '<svg class="fin-spark" width="110" height="28">' +
                        '<polyline points="' + sparks[i] + '" fill="none" stroke="' + stroke + '" stroke-width="1.5"/>' +
                    '</svg>' +
                    '<span class="fin-price">$' + p.toFixed(2) + '</span>' +
                    '<span class="fin-change ' + (up ? 'fin-up' : 'fin-down') + '">' +
                        (up ? '▲' : '▼') + ' ' + Math.abs(pct).toFixed(2) + '%' +
                    '</span>';
                container.appendChild(row);
            }

            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: FIN_TOTAL,
                render: render,
            });

            let live = true;
            const btn = document.getElementById('liveBtn');
            btn.addEventListener('click', () => {
                live = !live;
                btn.classList.toggle('is-active', live);
                btn.textContent = live ? '⏸ Pause stream' : '▶ Resume stream';
            });

            setInterval(() => {
                if (!live) return;
                for (let i = 0; i < FIN_TOTAL; i++) {
                    const drift = (Math.random() - 0.5) * 0.02;
                    prices[i] = Math.max(1, Math.round(prices[i] * (1 + drift) * 100) / 100);
                }
                demo.refresh();
            }, 1200);
        })();
    </script>
</body>
</html>
