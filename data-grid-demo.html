<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Grid · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S1NK61TS72"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-S1NK61TS72');
</script>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page grid-page">
            <div class="demo-page__header">
                <h1>📊 Enterprise Data Grid</h1>
                <p id="subtitle">Sort, search, and multi-select across 100,000 of 100,000 records.</p>
            </div>

            <div class="demo-toolbar">
                <input id="search" type="search" placeholder="Search id, name, email, department…" style="flex:1; min-width:220px">
                <button id="exportBtn" type="button">📥 Export</button>
                <button id="resetBtn" type="button">🔄 Reset</button>
                <span class="stat"><strong id="countLabel">100,000</strong> rows</span>
            </div>

            <div class="demo-scroll grid-scroll" id="scroll">
                <div class="grid-h-scroll" id="hscroll">
                    <div class="grid-head" id="head"></div>
                    <div data-cerious-scroll-content class="grid-scroll-content"></div>
                </div>
            </div>

            <div class="demo-footer">
                <span>Selected: <strong id="selCount">0</strong></span>
                <span>Ctrl/Cmd-click to multi-select · click a header to sort</span>
            </div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260611"></script>
    <script src="demo-bootstrap.js?v=20260611"></script>
    <script>
        (function () {
            const GRID_TOTAL = 100000;
            const FIRST = ['James','Mary','John','Patricia','Robert','Jennifer','Michael','Linda','William','Elizabeth','David','Barbara','Richard','Susan','Joseph','Jessica'];
            const LAST  = ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Wilson','Anderson','Thomas','Taylor'];
            const DEPARTMENTS = ['Engineering','Sales','Marketing','Support','Finance','HR','Operations','Product'];
            const STATUSES = ['Active','Pending','Inactive'];
            const REGIONS = ['North America','Europe','Asia Pacific','Latin America','Middle East','Africa'];
            const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const COLUMNS = [
                { key: 'index', label: '#', sortable: false },
                { key: 'id', label: 'ID', sortable: true },
                { key: 'name', label: 'Name', sortable: true },
                { key: 'email', label: 'Email', sortable: true },
                { key: 'department', label: 'Department', sortable: true },
                { key: 'status', label: 'Status', sortable: true },
                { key: 'region', label: 'Region', sortable: true },
                { key: 'revenue', label: 'Revenue', sortable: true },
                { key: 'score', label: 'Score', sortable: true },
                { key: 'date', label: 'Date', sortable: true },
            ];
            const { hash, randInt, pick } = window.demoUtils;

            function makeRow(index) {
                const first = pick(FIRST, index, 1);
                const last = pick(LAST, index, 2);
                const revenue = Math.round((hash(index, 3) * 120000 - 20000) * 100) / 100;
                const score = Math.round(hash(index, 4) * 1000) / 10;
                const daysAgo = randInt(index, 0, 365, 5);
                const rawDate = Date.UTC(2025, 11, 31) - daysAgo * 86400000;
                const d = new Date(rawDate);
                const date = MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
                return {
                    index,
                    id: 'ID-' + String(index).padStart(7, '0'),
                    name: first + ' ' + last,
                    email: first.toLowerCase() + '.' + last.toLowerCase() + Math.floor(index / 100) + '@company.com',
                    department: pick(DEPARTMENTS, index, 6),
                    status: STATUSES[index % 3],
                    region: pick(REGIONS, index, 7),
                    revenue, score, date, rawDate,
                };
            }
            function statusClass(s) {
                return s === 'Active' ? 'status-active' : s === 'Pending' ? 'status-pending' : 'status-inactive';
            }
            function matches(r, q) {
                return r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) ||
                       r.email.toLowerCase().includes(q) || r.department.toLowerCase().includes(q);
            }
            function sortValue(r, col) {
                if (col === 'revenue' || col === 'score') return r[col];
                if (col === 'date') return r.rawDate;
                if (col === 'index') return r.index;
                return r[col];
            }
            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            let query = '';
            let sortCol = null;
            let sortDir = 'asc';
            const selected = new Set();

            function buildOrder() {
                const q = query.trim().toLowerCase();
                const order = [];
                for (let i = 0; i < GRID_TOTAL; i++) {
                    if (!q || matches(makeRow(i), q)) order.push(i);
                }
                if (sortCol) {
                    const keyed = order.map((i) => ({ i, k: sortValue(makeRow(i), sortCol) }));
                    keyed.sort((a, b) => {
                        const c = a.k < b.k ? -1 : a.k > b.k ? 1 : 0;
                        return sortDir === 'asc' ? c : -c;
                    });
                    return keyed.map((e) => e.i);
                }
                return order;
            }

            let order = buildOrder();

            function renderHead() {
                const head = document.getElementById('head');
                head.innerHTML = COLUMNS.map((c) => {
                    const isActive = sortCol === c.key;
                    const arrow = isActive ? (sortDir === 'asc' ? '▲' : '▼') : '⇅';
                    return '<div class="grid-head__cell' + (c.sortable ? ' sortable' : '') + '" data-col="' + c.key + '">' +
                        c.label +
                        (c.sortable ? ' <span class="grid-head__sort' + (isActive ? ' active' : '') + '">' + arrow + '</span>' : '') +
                    '</div>';
                }).join('');
            }

            function render(visIdx, container) {
                const src = order[visIdx];
                if (src == null) return;
                const r = makeRow(src);
                const row = document.createElement('div');
                row.className = 'grid-row' + (selected.has(src) ? ' selected' : '');
                row.dataset.src = src;
                row.innerHTML =
                    '<div class="grid-cell rownum">' + (r.index + 1) + '</div>' +
                    '<div class="grid-cell id">' + r.id + '</div>' +
                    '<div class="grid-cell">' + escapeHtml(r.name) + '</div>' +
                    '<div class="grid-cell email">' + escapeHtml(r.email) + '</div>' +
                    '<div class="grid-cell">' + escapeHtml(r.department) + '</div>' +
                    '<div class="grid-cell"><span class="badge ' + statusClass(r.status) + '">' + r.status + '</span></div>' +
                    '<div class="grid-cell">' + escapeHtml(r.region) + '</div>' +
                    '<div class="grid-cell num ' + (r.revenue >= 0 ? 'cell-positive' : 'cell-negative') + '">' +
                        (r.revenue >= 0 ? '+' : '−') + '$' + Math.abs(r.revenue).toLocaleString() +
                    '</div>' +
                    '<div class="grid-cell num">' + r.score.toFixed(1) + '</div>' +
                    '<div class="grid-cell">' + r.date + '</div>';
                container.appendChild(row);
            }

            function updateLabels() {
                document.getElementById('subtitle').textContent =
                    'Sort, search, and multi-select across ' + order.length.toLocaleString() + ' of 100,000 records.';
                document.getElementById('countLabel').textContent = order.length.toLocaleString();
                document.getElementById('selCount').textContent = selected.size;
            }

            const hScroll = document.getElementById('hscroll');
            renderHead();
            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: Math.max(1, order.length),
                render: render,
                options: {
                    touch: { enabled: true, getHorizontalScrollTarget: () => hScroll },
                    wheel: { enabled: true, getHorizontalScrollTarget: () => hScroll },
                },
            });
            updateLabels();

            function rebuild() {
                order = buildOrder();
                renderHead();
                updateLabels();
                demo.setTotal(Math.max(1, order.length));
                demo.jumpTo(0);
            }

            document.getElementById('head').addEventListener('click', (e) => {
                const cell = e.target.closest('[data-col]');
                if (!cell) return;
                const key = cell.dataset.col;
                const meta = COLUMNS.find((c) => c.key === key);
                if (!meta || !meta.sortable) return;
                if (sortCol === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                else { sortCol = key; sortDir = 'asc'; }
                rebuild();
            });

            let debounce;
            document.getElementById('search').addEventListener('input', (e) => {
                clearTimeout(debounce);
                const v = e.target.value;
                debounce = setTimeout(() => { query = v; rebuild(); }, 250);
            });

            document.getElementById('scroll').addEventListener('click', (e) => {
                const row = e.target.closest('.grid-row');
                if (!row) return;
                const src = parseInt(row.dataset.src, 10);
                const additive = e.ctrlKey || e.metaKey;
                if (!additive) selected.clear();
                if (selected.has(src) && (additive || selected.size === 0)) selected.delete(src);
                else selected.add(src);
                updateLabels();
                demo.refresh();
            });

            document.getElementById('exportBtn').addEventListener('click', () => {
                alert('Exporting ' + (selected.size || order.length) + ' rows…');
            });
            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('search').value = '';
                query = ''; sortCol = null; selected.clear();
                rebuild();
            });
        })();
    </script>
</body>
</html>
