<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog · Cerious-Scroll</title>
    <link rel="stylesheet" href="shared-styles.css?v=20260922">
</head>
<body>
    <header class="topbar" data-auto-topbar></header>

    <main class="content">
        <div class="demo-page">
            <div class="demo-page__header">
                <h1><span data-demo-icon="ecommerce"></span>Product Catalog</h1>
                <p>50,000 products with ratings and add-to-cart.</p>
            </div>

            <div class="demo-toolbar">
                <span class="stat">🛒 Cart: <strong id="cartCount">0</strong> <span id="cartLabel">items</span></span>
                <span class="spacer"></span>
                <button id="clearBtn" type="button" disabled>Clear cart</button>
            </div>

            <div class="demo-scroll shop-scroll" id="scroll"></div>

            <div class="demo-footer">
                <span>In cart: <strong id="cartCount2">0</strong></span>
                <span>Click "Add to cart" on any product</span>
            </div>
        </div>
    </main>

    <script src="dist/cerious-scroll.bundle.js?v=20260922"></script>
    <script src="demo-icons.js?v=20260922"></script>
    <script src="demo-docs.js?v=20260922"></script>
    <script src="demo-bootstrap.js?v=20260922"></script>
    <script>
        (function () {
            const SHOP_TOTAL = 50000;
            const ADJ = ['Wireless', 'Ergonomic', 'Premium', 'Compact', 'Pro', 'Ultra', 'Smart', 'Eco', 'Vintage', 'Rugged'];
            const NOUN = ['Headphones', 'Keyboard', 'Mouse', 'Monitor', 'Webcam', 'Desk Lamp', 'Backpack', 'Water Bottle', 'Notebook', 'Charger'];
            const CATS = ['Electronics', 'Home & Office', 'Accessories', 'Outdoors', 'Audio', 'Computing'];
            const EMOJI = ['🎧', '⌨️', '🖱️', '🖥️', '📷', '💡', '🎒', '🍶', '📓', '🔌'];
            const GRADS = [
                'linear-gradient(135deg,#667eea,#764ba2)',
                'linear-gradient(135deg,#f093fb,#f5576c)',
                'linear-gradient(135deg,#4facfe,#00f2fe)',
                'linear-gradient(135deg,#43e97b,#38f9d7)',
                'linear-gradient(135deg,#fa709a,#fee140)',
                'linear-gradient(135deg,#30cfd0,#330867)',
            ];
            const { hash, randInt, pick } = window.demoUtils;

            function makeProduct(index) {
                const n = index % NOUN.length;
                return {
                    name: pick(ADJ, index, 1) + ' ' + NOUN[n],
                    category: pick(CATS, index, 2),
                    price: Math.round((hash(index, 3) * 280 + 9.99) * 100) / 100,
                    rating: Math.round((3 + hash(index, 4) * 2) * 10) / 10,
                    reviews: randInt(index, 12, 9800, 5),
                    emoji: EMOJI[n],
                    gradient: GRADS[index % GRADS.length],
                    inStock: index % 11 !== 0,
                    prime: index % 3 === 0,
                };
            }
            function stars(rating) {
                const full = Math.round(rating);
                return '★★★★★'.slice(0, full) + '☆☆☆☆☆'.slice(0, 5 - full);
            }
            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            const cart = new Set();

            function updateCart() {
                const n = cart.size;
                document.getElementById('cartCount').textContent = n;
                document.getElementById('cartCount2').textContent = n;
                document.getElementById('cartLabel').textContent = n === 1 ? 'item' : 'items';
                document.getElementById('clearBtn').disabled = n === 0;
            }

            function render(i, container) {
                const p = makeProduct(i);
                const row = document.createElement('div');
                row.className = 'product';
                let aside;
                if (!p.inStock) {
                    aside = '<div class="product__stock">Out of stock</div>';
                } else {
                    const inCart = cart.has(i);
                    aside = '<button type="button" class="product__add' + (inCart ? ' in-cart' : '') + '" data-add="' + i + '">' +
                        (inCart ? 'In cart ✓' : 'Add to cart') + '</button>';
                }
                row.innerHTML =
                    '<div class="product__img" style="background:' + p.gradient + '">' + p.emoji + '</div>' +
                    '<div class="product__body">' +
                        '<div class="product__name">' + escapeHtml(p.name) + '</div>' +
                        '<div class="product__cat">' + escapeHtml(p.category) + '</div>' +
                        '<div class="product__rating">' + stars(p.rating) +
                            ' <small>' + p.rating.toFixed(1) + ' · ' + p.reviews.toLocaleString() + ' reviews</small>' +
                        '</div>' +
                    '</div>' +
                    '<div class="product__aside">' +
                        '<div class="product__price">$' + p.price.toFixed(2) + '</div>' +
                        (p.prime ? '<div class="product__prime">✓ Prime</div>' : '') +
                        aside +
                    '</div>';
                container.appendChild(row);
            }

            const demo = window.mountDemo({
                host: document.getElementById('scroll'),
                total: SHOP_TOTAL,
                render: render,
            });

            document.getElementById('scroll').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-add]');
                if (!btn) return;
                const i = parseInt(btn.dataset.add, 10);
                if (cart.has(i)) cart.delete(i); else cart.add(i);
                updateCart();
                demo.refresh();
            });
            document.getElementById('clearBtn').addEventListener('click', () => {
                cart.clear(); updateCart(); demo.refresh();
            });
        })();
    </script>
    <!-- "How to build this": the options this demo exists to show,
         pulled out of the page source and put next to the demo. -->
    <script>
        // Deferred on some pages, inline on others: either way this runs
        // before demo-docs.js has executed unless we wait for it.
        (function (config) {
            function mount() { window.demoDocs(config); }
            if (window.demoDocs) mount();
            else document.addEventListener('DOMContentLoaded', mount);
        }({
        "feature": "Product cards with state that survives recycling",
        "intro": "A catalogue row carries state the DOM cannot be trusted to keep: quantity in the cart, whether something is favourited, which variant is selected. The container your renderer receives is recycled, so anything written onto the node belongs to whichever product held it last. The rule is that your data is the source of truth and the DOM is a projection of it. Every render writes the full state, and every interaction writes back to the data before asking for a repaint.",
        "code": "\n    const cart = new Map();   // id -> quantity. The truth lives here.\n\n    const scroller = new CeriousScroll(host, products.length, {\n      render: function (index, container) {\n        const p = products[index];\n        container.textContent = '';\n        const card = buildCard(p);\n        // Write the CURRENT state every time: never assume what was there.\n        card.querySelector('.qty').textContent = cart.get(p.id) || 0;\n        card.dataset.productId = p.id;\n        container.appendChild(card);\n      }\n    });\n\n    // Delegated: the listener outlives any card it fires for.\n    host.addEventListener('click', function (e) {\n      const card = e.target.closest('[data-product-id]');\n      if (!e.target.matches('.add') || !card) return;\n      const id = card.dataset.productId;\n      cart.set(id, (cart.get(id) || 0) + 1);\n      scroller.refresh();\n    });\n  ",
        "notes": [
                "Never store state only on the DOM node: recycling will hand it to a different product.",
                "Delegate events to the host and identify the row by a data attribute rewritten on every render.",
                "Reserve image space with <code>aspect-ratio</code> so a late-loading photo does not change the card's measured height.",
                "<code>refresh()</code> repaints the mounted rows; it does not re-create anything, so it is cheap enough for a click handler."
        ],
        "docs": "https://github.com/ceriousdevtech/cerious-scroll/blob/main/docs/IMPLEMENTATION_GUIDE.md"
    }));
    </script>
</body>
</html>
